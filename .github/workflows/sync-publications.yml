name: Sync publications from OpenAlex

on:
  schedule:
    # Mondays at 13:00 UTC
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Query OpenAlex for new works
        run: python3 scripts/sync_openalex.py

      - name: Open a PR if new works were found
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: scripts/openalex-preview.json
          commit-message: "Found new publications on OpenAlex"
          branch: sync/openalex-preview
          delete-branch: true
          title: "New publication(s) found on OpenAlex"
          body: |
            [`scripts/sync_openalex.py`](../blob/main/scripts/sync_openalex.py) found work(s) on
            [OpenAlex](https://openalex.org) (via Shaye's ORCID iD) that aren't yet in
            `data/publications.json`, `data/working_papers.json`, or
            `data/manuscripts_in_prep.json`. See `scripts/openalex-preview.json` for details.

            This PR does **not** update the site's data files automatically — for each entry:
            1. Decide whether it belongs in `data/publications.json` (published) or
               `data/working_papers.json` (preprint / under review).
            2. Reformat authors to house style (`Last, F.`) and add real `tags` / `subtopics`
               (see `.claude/skills/update-site-data/references/schemas.md`).
            3. Move the entry into the right file, then delete `scripts/openalex-preview.json`
               and merge.

            If this looks wrong (duplicate, not actually Shaye's paper, etc.), just close the PR.
