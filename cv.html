<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Page title is also set from data/profile.json at load time -->
  <title>CV · Shaye Hopkins</title>
  <meta name="description" content="Curriculum vitae for Shaye Hopkins, behavioral scientist.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="icon" type="image/png" href="./assets/images/sh-logo.png">
</head>
<body data-page-title="CV">

  <header class="site-header">
    <nav class="shell nav-container site-nav" aria-label="Main navigation">
      <a class="brand nav-name" href="./index.html" id="nav-name"><img src="./assets/images/main-logo.png" alt="Shaye Hopkins Logo"></a>
      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">&#9776;</button>
      <ul class="nav-links">
        <li><a href="./index.html">Home</a></li>
        <li><a href="./research.html">Research</a></li>
        <li><a href="./cv.html" class="active">CV</a></li>
        <li><a href="./contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main id="top">
    <!-- Every section below is rendered from a data/*.json file, same as research.html -
         see schemas.md. A section with no data hides itself automatically. -->
    <section id="cv" class="section" hidden>
      <div class="shell cv-page">
        <div class="cv-header-row">
          <div id="cv-header-container"></div>
          <button type="button" class="btn secondary cv-print-btn" onclick="window.print()">Print / Save as PDF</button>
        </div>

        <section id="cv-education" class="cv-section" hidden>
          <h2>Education</h2>
          <div id="education-container" class="item-list"></div>
        </section>

        <div id="tag-filter-bar" class="tag-filter-bar" role="group" aria-label="Filter papers by topic" hidden></div>
        <div id="subtopic-filter-bar" class="tag-filter-bar" role="group" aria-label="Filter papers by subtopic" hidden></div>

        <section id="cv-publications" class="cv-section" hidden>
          <h2>Publications</h2>
          <div id="publications-container" class="paper-list"></div>
        </section>

        <section id="cv-working-papers" class="cv-section" hidden>
          <h2>Working Papers</h2>
          <div id="working-papers-container" class="paper-list"></div>
        </section>

        <section id="cv-manuscripts" class="cv-section" hidden>
          <h2>Manuscripts in Preparation</h2>
          <div id="manuscripts-container" class="paper-list"></div>
        </section>

        <section id="cv-media" class="cv-section" hidden>
          <h2>Selected Popular Press</h2>
          <div id="media-container" class="item-list"></div>
        </section>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="shell footer-row">
      <div id="footer-name"></div>
      <div>
        <a href="https://www.linkedin.com/in/shaye-hopkins/">LinkedIn</a> &middot;
        <a href="mailto:shaye.mcd@gmail.com">Email</a>
      </div>
    </div>
  </footer>

  <div id="cookie-notice" class="cookie-notice" hidden>
    <p>This site uses cookies for basic analytics.</p>
    <button type="button" data-cookie-accept>OK</button>
  </div>

  <script src="./js/utils.js"></script>
  <script src="./js/site-chrome.js"></script>
  <script src="./js/cookie-notice.js"></script>
  <script src="./js/cv.js"></script>
  <script src="./js/education.js"></script>
  <script src="./js/publications.js"></script>
  <script src="./js/working_papers.js"></script>
  <script src="./js/manuscripts_in_prep.js"></script>
  <script src="./js/paper-filters.js"></script>
  <script src="./js/media.js"></script>
</body>
</html>
