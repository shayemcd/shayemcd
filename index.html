<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Page title is also set from data/profile.json at load time -->
  <title>Shaye Hopkins · Behavioral Researcher</title>
  <meta name="description" content="Shaye Hopkins is a behavioral scientist studying belief formation, trust, and decision-making.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="icon" type="image/png" href="./assets/images/sh-logo.png">
</head>
<body>

  <header class="site-header">
    <nav class="shell nav-container site-nav" aria-label="Main navigation">
      <a class="brand nav-name" href="./index.html" id="nav-name"><img src="./assets/images/main-logo.png" alt="Shaye Hopkins Logo"></a>
      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">&#9776;</button>
      <ul class="nav-links">
        <li><a href="./index.html" class="active">Home</a></li>
        <li><a href="./research.html">Research</a></li>
        <li><a href="./cv.html">CV</a></li>
        <li><a href="./contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main id="top">
    <!-- Hero and About are rendered from data/profile.json by js/profile.js; Research Focus
         is a compact teaser (topic tags linking to research.html) rendered from
         data/ongoing_projects.json by js/ongoing_projects.js - the full write-ups live on
         research.html instead of duplicating them here. Do not hardcode content here: edit
         the JSON files instead. A section with no data hides itself automatically. -->

    <section id="hero" class="section">
      <div class="shell">
        <div id="hero-container"></div>
      </div>
    </section>

    <section id="research" class="section muted teaser-section" hidden>
      <div class="shell">
        <div class="teaser-row">
          <div class="teaser-copy">
            <span class="pill">Research Focus</span>
            <p class="teaser-lede">Belief formation, institutional trust, well-being, and sustainable behavior change &mdash; three threads run through my work.</p>
          </div>
          <div id="research-teaser-container" class="teaser-focus-row"></div>
        </div>
        <a class="teaser-more" href="./research.html#research">See full research</a>
      </div>
    </section>

    <section id="about" class="section" hidden>
      <div class="shell about-content">
        <span class="pill">About</span>
        <h2>About Me</h2>
        <div class="divider-topo" aria-hidden="true"><svg viewBox="0 0 220 14" preserveAspectRatio="none"><path d="M0 7 Q 18.3 0 36.6 7 T 73.2 7 T 109.8 7 T 146.4 7 T 183 7 T 220 7"/></svg></div>
        <div id="about-container"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="shell footer-row">
      <div id="footer-name"></div>
      <div id="footer-links"></div>
    </div>
  </footer>

  <div id="cookie-notice" class="cookie-notice" hidden>
    <p>This site uses cookies for basic analytics.</p>
    <button type="button" data-cookie-accept>OK</button>
  </div>

  <script src="./js/utils.js"></script>
  <script src="./js/site-chrome.js"></script>
  <script src="./js/cookie-notice.js"></script>
  <script src="./js/profile.js"></script>
  <script src="./js/ongoing_projects.js"></script>
</body>
</html>
