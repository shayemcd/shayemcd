<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Page title is also set from data/profile.json at load time -->
  <title>Contact · Shaye Hopkins</title>
  <meta name="description" content="Get in touch with Shaye Hopkins, behavioral scientist.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="icon" type="image/png" href="./assets/images/sh-logo.png">
</head>
<body data-page-title="Contact">

  <header class="site-header">
    <nav class="shell nav-container site-nav" aria-label="Main navigation">
      <a class="brand nav-name" href="./index.html" id="nav-name"><img src="./assets/images/main-logo.png" alt="Shaye Hopkins Logo"></a>
      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">&#9776;</button>
      <ul class="nav-links">
        <li><a href="./index.html">Home</a></li>
        <li><a href="./research.html">Research</a></li>
        <li><a href="./cv.html">CV</a></li>
        <li><a href="./contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main id="top">
    <section id="contact" class="section">
      <div class="shell grid two contact-grid">
        <div>
          <span class="pill">Get in Touch</span>
          <h2>Let's connect</h2>
          <p class="lede">I'm always open to research collaborations, applied partnerships, or just connecting. Feel free to reach out!</p>

          <div class="card contact-channels">
            <h3>Other Channels</h3>
            <a href="https://www.linkedin.com/in/shaye-hopkins/" target="_blank">Connect on LinkedIn &rarr;</a>
          </div>
        </div>

        <div class="card">
          <form action="https://formspree.io/f/mblnnqdr" method="POST">
            <div class="field">
              <label for="name">Name</label>
              <input type="text" id="name" name="name" required>
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required>
            </div>
            <div class="field">
              <label for="message">Message</label>
              <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn btn-block">Send</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="shell footer-row">
      <div id="footer-name"></div>
      <div id="footer-links"></div>
    </div>
  </footer>

  <div id="cookie-notice" class="cookie-notice" hidden>
    <p>This site uses cookies for basic analytics.</p>
    <button type="button" data-cookie-accept>OK</button>
  </div>

  <script src="./js/utils.js"></script>
  <script src="./js/site-chrome.js"></script>
  <script src="./js/cookie-notice.js"></script>
</body>
</html>
